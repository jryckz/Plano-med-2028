<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano Operacional Prescritivo — 11 Meses — ENEM Medicina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F0;
    --paper-2:#E4EAE7;
    --card:#FCFDFC;
    --ink:#152423;
    --ink-soft:#4C5F5C;
    --ink-faint:#7C8D8A;
    --line:#C7D2CE;
    --line-strong:#A9B8B3;
    --teal:#1F6F63;
    --teal-deep:#123F38;
    --teal-pale:#DCEAE6;
    --rubric:#B23A2E;
    --rubric-pale:#F5E3E0;
    --amber:#B8792A;
    --amber-pale:#F3E6D3;
    --shadow: 0 1px 2px rgba(21,36,35,0.06), 0 6px 20px rgba(21,36,35,0.06);
    --radius: 3px;
    --serif: 'IBM Plex Serif', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--teal); color:#fff; }

  a{color:inherit;}

  /* subtle paper grain via layered gradients */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(31,111,99,0.035) 0px, rgba(31,111,99,0.035) 1px, transparent 1px, transparent 96px);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns: 296px 1fr;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    border-right:1px solid var(--line);
    background:var(--paper-2);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand .eyebrow{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .brand .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 3px var(--teal-pale);
  }
  .brand h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:19px;
    margin:8px 0 2px;
    letter-spacing:-.01em;
    line-height:1.25;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
  }

  .adherence{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
  }
  .adherence .num{
    font-size:26px;
    font-weight:600;
    color:var(--teal-deep);
    letter-spacing:-.02em;
  }
  .adherence .num span{ font-size:14px; color:var(--ink-faint); font-weight:400; }
  .adherence .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .adherence .bar{
    margin-top:9px;
    height:5px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .adherence .bar > i{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--teal),var(--teal-deep));
    width:0%;
    transition:width .5s ease;
  }

  .nav-scroll{
    flex:1;
    overflow-y:auto;
    padding:8px 10px 20px;
  }
  .nav-scroll::-webkit-scrollbar{width:8px;}
  .nav-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  .m-block{ margin-bottom:2px; }
  .m-head{
    display:flex; align-items:center; gap:9px;
    width:100%;
    padding:9px 10px;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    border-radius:var(--radius);
    font-family:var(--sans);
    font-size:13px;
    color:var(--ink);
  }
  .m-head:hover{ background:rgba(31,111,99,0.07); }
  .m-head.open{ background:rgba(31,111,99,0.10); }
  .m-head .idx{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--teal-deep);
    background:var(--teal-pale);
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .m-head .m-title{ flex:1; font-weight:500; line-height:1.3; }
  .m-head .m-pct{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    flex-shrink:0;
  }
  .m-head .chev{
    width:9px;height:9px;
    flex-shrink:0;
    border-right:1.5px solid var(--ink-faint);
    border-bottom:1.5px solid var(--ink-faint);
    transform:rotate(-45deg);
    transition:transform .18s ease;
    margin-right:2px;
  }
  .m-head.open .chev{ transform:rotate(45deg); }

  .w-list{ display:none; padding:2px 0 6px 22px; border-left:1px solid var(--line); margin-left:19px; }
  .w-list.open{ display:block; }
  .w-item{ margin-bottom:1px; }
  .w-head{
    width:100%;
    padding:7px 8px;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    border-radius:var(--radius);
    display:flex; justify-content:space-between; align-items:center;
  }
  .w-head:hover{ background:rgba(31,111,99,0.06); }
  .w-head.open{ color:var(--teal-deep); font-weight:600; }
  .d-list{ display:none; padding-left:10px; }
  .d-list.open{ display:block; }
  .d-item{
    width:100%;
    display:flex; align-items:center; gap:7px;
    padding:6px 8px;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    font-size:12px;
    color:var(--ink-soft);
    border-radius:var(--radius);
  }
  .d-item:hover{ background:rgba(31,111,99,0.06); color:var(--ink); }
  .d-item.active{ background:var(--teal); color:#fff; }
  .d-item .dot{
    width:7px;height:7px;border-radius:50%;
    border:1.4px solid var(--ink-faint);
    flex-shrink:0;
  }
  .d-item.done .dot{ background:var(--teal); border-color:var(--teal); }
  .d-item.active .dot{ border-color:#fff; }
  .d-item.active.done .dot{ background:#fff; }
  .d-item .dname{ flex:1; }
  .d-item .dtag{ font-family:var(--mono); font-size:9.5px; opacity:.7; }

  .sidebar-foot{
    padding:12px 20px;
    border-top:1px solid var(--line);
  }
  .protocol-btn{
    display:flex; align-items:center; gap:8px;
    width:100%;
    padding:9px 10px;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    cursor:pointer;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
  }
  .protocol-btn:hover{ border-color:var(--teal); color:var(--teal-deep); }

  /* mobile nav toggle */
  .nav-toggle{ display:none; }

  /* ---------- MAIN ---------- */
  .main{
    min-width:0;
    padding: 34px 48px 90px;
    max-width: 900px;
  }
  .topline{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 26px;
    gap: 16px;
  }
  .topline .crumbs{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .topline .crumbs b{ color:var(--teal-deep); }
  .day-nav{ display:flex; gap:6px; }
  .day-nav button{
    width:30px;height:30px;
    border:1px solid var(--line-strong);
    background:var(--card);
    border-radius:var(--radius);
    cursor:pointer;
    font-family:var(--mono);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .day-nav button:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .day-nav button:disabled{ opacity:.3; cursor:default; }

  /* ---------- ABOUT / PROTOCOL VIEW ---------- */
  .about h2{
    font-family:var(--serif);
    font-size:30px;
    font-weight:600;
    letter-spacing:-.01em;
    margin:0 0 6px;
  }
  .about .lede{
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:60ch;
    margin-bottom:28px;
  }
  .rules-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding: 6px 0;
    margin-bottom: 22px;
  }
  .rule-row{
    display:grid;
    grid-template-columns: 96px 1fr;
    gap: 18px;
    padding: 15px 22px;
    border-bottom:1px solid var(--line);
    align-items:baseline;
  }
  .rule-row:last-child{ border-bottom:none; }
  .rule-row .rk{
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--teal-deep);
    padding-top:2px;
  }
  .rule-row .rv{ font-size:14px; color:var(--ink); }
  .about .refs{
    font-size:12px;
    color:var(--ink-faint);
    font-family:var(--mono);
    line-height:1.9;
  }
  .about .refs .rtitle{
    font-family:var(--sans);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:10px;
    margin: 26px 0 30px;
  }
  .month-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 15px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .month-card:hover{ border-color:var(--teal); transform:translateY(-1px); }
  .month-card .mc-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .month-card .mc-idx{ font-family:var(--mono); font-size:11px; color:var(--teal-deep); }
  .month-card .mc-pct{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
  .month-card .mc-title{ font-family:var(--serif); font-size:15px; font-weight:600; line-height:1.3; margin-bottom:10px; min-height:39px;}
  .month-card .mc-bar{ height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .month-card .mc-bar > i{ display:block; height:100%; background:var(--teal); }

  /* ---------- DAY SHEET ---------- */
  .sheet{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .sheet-head{
    padding: 24px 28px 20px;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(31,111,99,0.04), transparent 60%);
    position:relative;
  }
  .sheet-head .sh-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom:14px;
  }
  .sheet-head .sh-day{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    letter-spacing:-.01em;
    line-height:1.15;
  }
  .sheet-head .sh-meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-top:4px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:4px 9px;
    border-radius:20px;
    background:var(--teal-pale);
    color:var(--teal-deep);
    white-space:nowrap;
  }
  .badge.tt{ background:var(--amber-pale); color:#7A5320; }
  .content-line{
    font-size:15.5px;
    color:var(--ink);
    max-width:62ch;
    margin-top:2px;
  }
  .content-line b{ font-weight:600; }

  .done-toggle{
    display:flex; align-items:center; gap:9px;
    padding:8px 14px 8px 10px;
    border:1.5px solid var(--line-strong);
    border-radius:20px;
    background:var(--card);
    cursor:pointer;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    flex-shrink:0;
    transition: all .15s ease;
  }
  .done-toggle .cbx{
    width:17px;height:17px;
    border-radius:50%;
    border:1.5px solid var(--ink-faint);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .done-toggle.on{
    background:var(--teal); border-color:var(--teal); color:#fff;
  }
  .done-toggle.on .cbx{ background:#fff; border-color:#fff; }
  .done-toggle.on .cbx::after{
    content:"✓"; color:var(--teal); font-size:11px; font-weight:700;
  }

  /* timeline (signature element) */
  .timeline{
    padding: 22px 28px 8px;
  }
  .timeline .tl-title{
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--ink-faint);
    margin-bottom:14px;
  }
  .tl-row{
    display:grid;
    grid-template-columns: 92px 20px 1fr;
    column-gap: 4px;
  }
  .tl-time{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--teal-deep);
    font-weight:600;
    padding-top:2px;
    white-space:nowrap;
  }
  .tl-spine{
    display:flex; flex-direction:column; align-items:center;
  }
  .tl-tick{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--teal);
    flex-shrink:0;
    margin-top:4px;
    box-shadow:0 0 0 3px var(--teal-pale);
  }
  .tl-line{
    flex:1;
    width:1.5px;
    background:var(--line-strong);
    margin: 2px 0;
  }
  .tl-row:last-child .tl-line{ display:none; }
  .tl-desc{
    font-size:13.5px;
    color:var(--ink);
    padding-bottom:18px;
    line-height:1.55;
  }

  /* rubric grid */
  .rubric{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    border-top:1px solid var(--line);
  }
  .rubric .rf{
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  .rubric .rf:nth-child(2n){ border-right:none; }
  .rubric .rf .rf-k{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-faint);
    margin-bottom:5px;
    display:flex; align-items:center; gap:6px;
  }
  .rubric .rf .rf-k .sq{ width:6px;height:6px; background:var(--ink-faint); flex-shrink:0; }
  .rubric .rf.rf-alert .rf-k{ color:var(--rubric); }
  .rubric .rf.rf-alert .rf-k .sq{ background:var(--rubric); }
  .rubric .rf.rf-active .rf-k{ color:var(--teal-deep); }
  .rubric .rf.rf-active .rf-k .sq{ background:var(--teal); }
  .rubric .rf .rf-v{ font-size:13px; color:var(--ink); line-height:1.5; }

  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{
      position:fixed; z-index:40; left:0; top:0; width:88vw; max-width:340px;
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow: 8px 0 30px rgba(0,0,0,.15);
    }
    .sidebar.open{ transform:translateX(0); }
    .nav-toggle{
      display:flex; align-items:center; gap:8px;
      position:fixed; top:14px; left:14px; z-index:41;
      background:var(--ink); color:#fff;
      border:none; border-radius:20px;
      padding:9px 14px 9px 12px;
      font-family:var(--sans); font-size:12px; font-weight:600;
      box-shadow:var(--shadow);
    }
    .scrim{
      display:none;
      position:fixed; inset:0; background:rgba(21,36,35,0.35); z-index:35;
    }
    .scrim.open{ display:block; }
    .main{ padding: 68px 18px 70px; }
    .rubric{ grid-template-columns: 1fr; }
    .rubric .rf{ border-right:none; }
    .tl-row{ grid-template-columns: 74px 16px 1fr; }
    .sheet-head{ padding:20px 18px 18px; }
    .timeline{ padding:18px 18px 4px; }
    .rubric .rf{ padding:14px 18px; }
    .month-grid{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:480px){
    .month-grid{ grid-template-columns:1fr; }
    .sh-top{ flex-direction:column; }
  }

  .footer-note{
    margin-top:28px;
    font-size:11.5px;
    color:var(--ink-faint);
    font-family:var(--mono);
    display:flex; align-items:center; gap:8px;
  }
  .footer-note .k{ width:5px;height:5px; background:var(--teal); flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<button class="nav-toggle" id="navToggle" aria-label="Abrir navegação">☰ Plano</button>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="eyebrow">Ficha de execução</div>
      <h1>Plano Operacional Prescritivo</h1>
      <div class="sub">11 meses — ENEM Medicina</div>
    </div>
    <div class="adherence">
      <div class="num" id="advNum">0<span> / 308 dias</span></div>
      <div class="label">Adesão ao protocolo</div>
      <div class="bar"><i id="advBar"></i></div>
    </div>
    <nav class="nav-scroll" id="navScroll"></nav>
    <div class="sidebar-foot">
      <button class="protocol-btn" id="btnProtocol">📋 Regras fixas do protocolo</button>
    </div>
  </aside>

  <main class="main" id="main"></main>

09:50","x":"Resolver 25 questões exclusivamente sobre Revisão leve de 30 questões já erradas e corrigidas; usar cronômetro de 2 minutos por item em Linguagens/Humanas e 3 minutos nas demais áreas."},{"t":"09:50–10:20","x":"Corrigir as 25 questões; anotar o motivo de cada erro e refazer os itens errados sem olhar a resolução."},{"t":"10:20–11:00","x":"Registrar os erros do dia, criar no máximo 8 cartões e programar as revisões."}],"q":"25","rev":"Revisão D-1: cartões de Redação: leitura da própria rubrica e intervenção; revisão de 7 dias: conteúdo da Semana 3; revisão de 30 dias: conteúdo da Semana 1.","red":"Nenhuma redação completa neste dia.","sim":"Nenhum simulado neste dia.","tt":"3h líquidas","mat":"Caderno oficial de prova, gabarito do Inep, cronômetro e planilha de desempenho"},{"gi":306,"m":11,"w":4,"d":"Sábado","disc":"Logística e recuperação","cont":"Revisão final, logística de prova e descanso","exec":[{"t":"08:00–09:00","x":"Revisar uma única folha de fórmulas, unidades, conectivos e estrutura da redação; não resolver questões."},{"t":"09:00–13:00","x":"Encerrar o estudo. Conferir documento oficial, cartão de confirmação, duas canetas pretas de tubo transparente, água e alimentação; depois descansar. Não escrever redação, não abrir aula e não fazer questões."}],"q":"0","rev":"Nenhuma revisão cumulativa. Apenas a folha final de fórmulas e a logística já conferida.","red":"Nenhuma redação.","sim":"Nenhum simulado.","tt":"1h de estudo leve + 4h de descanso/logística","mat":"Caderno oficial de prova, gabarito do Inep, cronômetro e planilha de desempenho"},{"gi":307,"m":11,"w":4,"d":"Domingo","disc":"Logística e recuperação","cont":"Revisão final, logística de prova e descanso","exec":[{"t":"08:00–09:00","x":"Revisar uma única folha de fórmulas, unidades, conectivos e estrutura da redação; não resolver questões."},{"t":"09:00–13:00","x":"Encerrar o estudo. Conferir documento oficial, cartão de confirmação, duas canetas pretas de tubo transparente, água e alim <script>
(function(){
  "use strict";
  const RAW = document.getElementById('plan-data').textContent;
  const DATA = JSON.parse(RAW);
  const MESES = DATA.meses;
  const TOTAL = DATA.totalDias;

  const DIA_ABREV = {"Segunda-feira":"SEG","Terça-feira":"TER","Quarta-feira":"QUA","Quinta-feira":"QUI","Sexta-feira":"SEX","Sábado":"SÁB","Domingo":"DOM"};

  // ---- progress storage ----
  let progress = {};
  const STORE_KEY = 'enem-plano-progress-v1';

  function loadProgress(){
    return new Promise((resolve)=>{
      if(!window.storage){ resolve({}); return; }
      window.storage.get(STORE_KEY, false)
        .then(r=>{ try{ resolve(r && r.value ? JSON.parse(r.value) : {}); }catch(e){ resolve({}); } })
        .catch(()=> resolve({}));
    });
  }
  function saveProgress(){
    if(!window.storage) return;
    window.storage.set(STORE_KEY, JSON.stringify(progress), false).catch(()=>{});
  }

  // ---- flat day index for prev/next ----
  const FLAT = [];
  MESES.forEach(m=>{
    m.semanas.forEach(w=>{
      w.forEach(d=> FLAT.push(d));
    });
  });

  let currentGi = null; // null = about view
  let sidebarState = {}; // { "1": true (month open), "1-2": true (week open) }

  function pct(n,d){ return d? Math.round((n/d)*100) : 0; }

  function monthDoneCount(m){
    let c=0, t=0;
    m.semanas.forEach(w=> w.forEach(d=>{ t++; if(progress[d.gi]) c++; }));
    return {c,t};
  }
  function weekDoneCount(w){
    let c=0; w.forEach(d=>{ if(progress[d.gi]) c++; });
    return {c,t:w.length};
  }
  function overallDone(){
    let c=0; FLAT.forEach(d=>{ if(progress[d.gi]) c++; });
    return c;
  }

  function renderTopProgress(){
    const c = overallDone();
    document.getElementById('advNum').innerHTML = c + '<span> / '+TOTAL+' dias</span>';
    document.getElementById('advBar').style.width = pct(c,TOTAL)+'%';
  }

  // ---------- SIDEBAR NAV ----------
  function buildNav(){
    const nav = document.getElementById('navScroll');
    nav.innerHTML = '';
    MESES.forEach(m=>{
      const mKey = 'm'+m.n;
      const mOpen = !!sidebarState[mKey];
      const {c:mc,t:mt} = monthDoneCount(m);

      const block = document.createElement('div');
      block.className = 'm-block';

      const head = document.createElement('button');
      head.className = 'm-head' + (mOpen?' open':'');
      head.innerHTML = `<span class="chev"></span><span class="idx">${m.n}</span><span class="m-title">${shortMonthTitle(m.titulo)}</span><span class="m-pct">${pct(mc,mt)}%</span>`;
      head.addEventListener('click', ()=>{
        sidebarState[mKey] = !sidebarState[mKey];
        buildNav();
      });
      block.appendChild(head);

      const wList = document.createElement('div');
      wList.className = 'w-list' + (mOpen?' open':'');
      m.semanas.forEach((w,wi)=>{
        const wNum = wi+1;
        const wKey = mKey+'-w'+wNum;
        const wOpen = !!sidebarState[wKey];
        const {c:wc,t:wt} = weekDoneCount(w);

        const wItem = document.createElement('div');
        wItem.className = 'w-item';
        const wHead = document.createElement('button');
        wHead.className = 'w-head' + (wOpen?' open':'');
        wHead.innerHTML = `<span>Semana ${wNum}</span><span>${wc}/${wt}</span>`;
        wHead.addEventListener('click', ()=>{
          sidebarState[wKey] = !sidebarState[wKey];
          buildNav();
        });
        wItem.appendChild(wHead);

        const dList = document.createElement('div');
        dList.className = 'd-list' + (wOpen?' open':'');
        w.forEach(d=>{
          const dBtn = document.createElement('button');
          const isActive = d.gi === currentGi;
          const isDone = !!progress[d.gi];
          dBtn.className = 'd-item' + (isActive?' active':'') + (isDone?' done':'');
          dBtn.innerHTML = `<span class="dot"></span><span class="dname">${DIA_ABREV[d.d]||d.d}</span><span class="dtag">${d.disc.split(' ')[0]}</span>`;
          dBtn.addEventListener('click', ()=>{
            sidebarState[mKey]=true; sidebarState[wKey]=true;
            showDay(d.gi);
            closeSidebarMobile();
          });
          dList.appendChild(dBtn);
        });
        wItem.appendChild(dList);
        wList.appendChild(wItem);
      });
      block.appendChild(wList);
      nav.appendChild(block);
    });
  }

  function shortMonthTitle(t){
    return t.replace(/^Mês\s*\d+\s*—\s*/,'');
  }

  // ---------- ABOUT VIEW ----------
  const RULES = [
    ["Seg–Sex","3 horas líquidas de estudo, das 08:00 às 11:00."],
    ["Sábado","5 horas líquidas, das 08:00 às 13:00."],
    ["Domingo","5 horas líquidas (08:00–13:00) nas semanas sem simulado. Simulado Dia 1: 5h30 (08:00–13:30). Simulado Dia 2: 5h (08:00–13:00)."],
    ["Correção","Todo bloco de estudo termina com correção e registro no caderno de erros."],
    ["Questões","Retiradas das provas oficiais do Inep na fase indicada; se a quantidade exceder uma prova, completar com o banco de questões do material principal."],
    ["Revisões","São exatamente as indicadas no plano — não criar revisões extras."],
  ];
  const REFS = [
    "[1] Inep — Outros documentos do ENEM.",
    "[2] Inep — Cartilha da Redação do ENEM 2025.",
    "[3] Inep — Questões são calculadas pela TRI."
  ];

  function renderAbout(){
    currentGi = null;
    const main = document.getElementById('main');
    let monthCards = MESES.map(m=>{
      const {c,t} = monthDoneCount(m);
      return `<div class="month-card" data-m="${m.n}">
        <div class="mc-top"><span class="mc-idx">MÊS ${String(m.n).padStart(2,'0')}</span><span class="mc-pct">${pct(c,t)}%</span></div>
        <div class="mc-title">${shortMonthTitle(m.titulo)}</div>
        <div class="mc-bar"><i style="width:${pct(c,t)}%"></i></div>
      </div>`;
    }).join('');

    main.innerHTML = `
      <div class="about">
        <div class="topline"><span class="crumbs">Protocolo</span></div>
        <h2>Plano Operacional Prescritivo</h2>
        <p class="lede">11 meses de preparação para o ENEM Medicina. Este documento substitui o cronograma anterior — execute os dias na ordem apresentada, sem acrescentar matérias, trocar a sequência ou pular a correção.</p>

        <div class="rules-card" id="rulesCard">
          ${RULES.map(r=>`<div class="rule-row"><div class="rk">${r[0]}</div><div class="rv">${r[1]}</div></div>`).join('')}
        </div>

        <div class="month-grid" id="monthGrid">${monthCards}</div>

        <div class="refs">
          <div class="rtitle">Referências operacionais</div>
          ${REFS.join('<br>')}
        </div>
      </div>
    `;
    main.querySelectorAll('.month-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        const mn = parseInt(card.dataset.m,10);
        const m = MESES[mn-1];
        const first = m.semanas[0][0];
        sidebarState['m'+mn] = true;
        sidebarState['m'+mn+'-w1'] = true;
        showDay(first.gi);
      });
    });
    buildNav();
    window.scrollTo(0,0);
  }

  // ---------- DAY VIEW ----------
  function fieldBlock(key, label, value, cls){
    return `<div class="rf ${cls||''}"><div class="rf-k"><span class="sq"></span>${label}</div><div class="rf-v">${value || '—'}</div></div>`;
  }

  function showDay(gi){
    currentGi = gi;
    const d = FLAT[gi];
    const m = MESES[d.m-1];
    const isDone = !!progress[gi];
    const idxInFlat = gi;

    const timelineHtml = d.exec.map((b,i)=>{
      return `<div class="tl-row">
        <div class="tl-time">${b.t || ''}</div>
        <div class="tl-spine"><span class="tl-tick"></span><span class="tl-line"></span></div>
        <div class="tl-desc">${b.x}</div>
      </div>`;
    }).join('');

    const hasSim = d.sim && !/^nenhum/i.test(d.sim.trim());
    const hasRed = d.red && !/^nenhuma/i.test(d.red.trim());

    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="topline">
        <span class="crumbs"><b>${shortMonthTitle(m.titulo)}</b> · Semana ${d.w} · ${d.d}</span>
        <div class="day-nav">
          <button id="btnPrev" ${idxInFlat<=0?'disabled':''} aria-label="Dia anterior">←</button>
          <button id="btnNext" ${idxInFlat>=TOTAL-1?'disabled':''} aria-label="Próximo dia">→</button>
        </div>
      </div>

      <div class="sheet">
        <div class="sheet-head">
          <div class="sh-top">
            <div>
              <div class="sh-day">${d.d}</div>
              <div class="sh-meta">Dia ${idxInFlat+1} de ${TOTAL} · Mês ${d.m}, Semana ${d.w}</div>
            </div>
            <button class="done-toggle ${isDone?'on':''}" id="doneToggle">
              <span class="cbx"></span>${isDone?'Executado':'Marcar executado'}
            </button>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
            <span class="badge">${d.disc}</span>
            <span class="badge tt">⏱ ${d.tt||'—'}</span>
            ${hasSim?'<span class="badge" style="background:var(--amber-pale);color:#7A5320;">Simulado</span>':''}
            ${hasRed?'<span class="badge" style="background:var(--rubric-pale);color:var(--rubric);">Redação</span>':''}
          </div>
          <div class="content-line"><b>${d.cont}</b></div>
        </div>

        <div class="timeline">
          <div class="tl-title">Execução horária</div>
          ${timelineHtml}
        </div>

        <div class="rubric">
          ${fieldBlock('q','Questões', d.q ? d.q + ' itens' : '0 itens')}
          ${fieldBlock('rev','Revisão prevista', d.rev)}
          ${fieldBlock('red','Redação', d.red, hasRed?'rf-active':'')}
          ${fieldBlock('sim','Simulado', d.sim, hasSim?'rf-alert':'')}
          ${fieldBlock('mat','Material obrigatório', d.mat)}
          ${fieldBlock('tt','Tempo total', d.tt)}
        </div>
      </div>

      <div class="footer-note"><span class="k"></span>Não pule a correção. Registre todos os erros no caderno antes de encerrar o bloco.</div>
    `;

    document.getElementById('doneToggle').addEventListener('click', ()=>{
      progress[gi] = !progress[gi];
      if(!progress[gi]) delete progress[gi];
      saveProgress();
      renderTopProgress();
      showDay(gi);
      buildNav();
    });
    const prevBtn = document.getElementById('btnPrev');
    const nextBtn = document.getElementById('btnNext');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(idxInFlat>0) showDay(idxInFlat-1); });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(idxInFlat<TOTAL-1) showDay(idxInFlat+1); });

    buildNav();
    window.scrollTo(0,0);
  }

  // ---------- mobile sidebar ----------
  const sidebarEl = document.getElementById('sidebar');
  const scrimEl = document.getElementById('scrim');
  document.getElementById('navToggle').addEventListener('click', ()=>{
    sidebarEl.classList.add('open'); scrimEl.classList.add('open');
  });
  scrimEl.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){
    sidebarEl.classList.remove('open'); scrimEl.classList.remove('open');
  }

  document.getElementById('btnProtocol').addEventListener('click', ()=>{
    renderAbout();
    closeSidebarMobile();
  });

  // ---------- init ----------
  loadProgress().then(p=>{
    progress = p || {};
    renderTopProgress();
    renderAbout();
  });

})();
</script>
</body>
</html>
